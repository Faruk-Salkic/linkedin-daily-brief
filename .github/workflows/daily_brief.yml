name: Daily LinkedIn Brief to Telegram & Dashboard

on:
  schedule:
    # Pokreće se svako jutro u 05:30 UTC (07:30 po našem vremenu)
    - cron: '30 5 * * *'
  workflow_dispatch: # Mogućnost ručnog pokretanja na dugme

permissions:
  contents: write

jobs:
  run-daily-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push updated dashboard data
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add docs/data.json
          git diff --staged --quiet || (git commit -m "Update daily brief dashboard [skip ci]" && git push)
