<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Dnevni Briefing | Faruk Salkić</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #090d16;
      --bg-card: rgba(18, 24, 38, 0.7);
      --bg-card-hover: rgba(24, 32, 52, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(99, 102, 241, 0.3);
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --accent-nekretnine: #06b6d4;
      --accent-osiguranje: #10b981;
      --accent-ai: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.1) 0%, transparent 45%);
      background-attachment: fixed;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* Header */
    header {
      margin-bottom: 2.5rem;
      text-align: center;
      position: relative;
    }

    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #c7d2fe;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 650px;
      margin: 0 auto;
      line-height: 1.5;
    }

    .meta-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    /* Controls Bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      color: #ffffff;
      background: rgba(99, 102, 241, 0.25);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0.4rem 0.8rem;
      gap: 0.5rem;
      width: 100%;
      max-width: 280px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.88rem;
      width: 100%;
    }

    .search-box input::placeholder {
      color: var(--text-dim);
    }

    /* Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.5rem;
    }

    /* Card */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-accent);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.9rem;
    }

    .category-tag {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .tag-nekretnine {
      background: rgba(6, 182, 212, 0.15);
      color: #67e8f9;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .tag-osiguranje {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .tag-ai {
      background: rgba(168, 85, 247, 0.15);
      color: #d8b4fe;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .source-link {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      transition: color 0.2s;
    }

    .source-link:hover {
      color: var(--primary);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }

    .post-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-md);
      padding: 1.1rem;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #cbd5e1;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 1.25rem;
      flex-grow: 1;
      font-family: inherit;
    }

    .post-box::-webkit-scrollbar {
      width: 5px;
    }
    .post-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
    }

    .char-badge {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    .copy-btn {
      background: var(--primary-gradient);
      border: none;
      color: #ffffff;
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.25);
    }

    .copy-btn:hover {
      opacity: 0.95;
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.35);
    }

    .copy-btn:active {
      transform: scale(0.98);
    }

    .copy-btn.copied {
      background: #10b981;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #10b981;
      color: #ffffff;
      padding: 0.85rem 1.4rem;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 999;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 768px) {
      .container { padding: 1.5rem 1rem 4rem; }
      h1 { font-size: 1.85rem; }
      .controls { flex-direction: column; align-items: stretch; }
      .search-box { max-width: 100%; }
      .cards-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge-top">
        <span class="pulse"></span>
        Dnevni AI Asistent za LinkedIn
      </div>
      <h1>LinkedIn Content Dashboard</h1>
      <p class="subtitle">Pregledaj današnje vijesti, odaberi najbolji post i kopiraj ga u 1 klik direktno za objavu.</p>
      <div class="meta-bar">
        <span id="current-date">📅 Učitavanje datuma...</span>
        <span>•</span>
        <span id="items-count">⚡ 9 spremnih postova</span>
      </div>
    </header>

    <div class="controls">
      <div class="tabs">
        <button class="tab-btn active" data-filter="all">🌟 Sve teme (9)</button>
        <button class="tab-btn" data-filter="nekretnine">🏢 Nekretnine HR (3)</button>
        <button class="tab-btn" data-filter="osiguranje">🛡️ Osiguranje DE (3)</button>
        <button class="tab-btn" data-filter="ai">🤖 AI & Biznis (3)</button>
      </div>
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search-input" placeholder="Pretraži teme ili riječi...">
      </div>
    </div>

    <div class="cards-grid" id="cards-container">
      <!-- Kartice se dinamički renderuju iz data.json -->
    </div>
  </div>

  <div class="toast" id="toast">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
    <span id="toast-msg">Post je uspješno kopiran u clipboard!</span>
  </div>

  <script>
    let allPosts = [];
    let currentFilter = 'all';

    async function loadData() {
      try {
        const res = await fetch('data.json?v=' + Date.now());
        const data = await res.json();
        
        document.getElementById('current-date').textContent = '📅 ' + (data.date_formatted || data.date);
        allPosts = data.posts || [];
        renderPosts();
      } catch (err) {
        console.error('Greška pri učitavanju data.json:', err);
        document.getElementById('cards-container').innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: #94a3b8;">
            <h3>Učitavanje podataka...</h3>
            <p style="margin-top: 0.5rem; font-size: 0.9rem;">Ako je repozitorij tek kreiran, podaci se ažuriraju za nekoliko trenutaka.</p>
          </div>
        `;
      }
    }

    function renderPosts() {
      const container = document.getElementById('cards-container');
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      
      const filtered = allPosts.filter(p => {
        const matchesCategory = currentFilter === 'all' || p.category === currentFilter;
        const matchesSearch = !searchQuery || 
          p.title.toLowerCase().includes(searchQuery) || 
          p.content.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: #94a3b8;">
            <h3>Nema pronađenih postova</h3>
            <p style="margin-top: 0.5rem; font-size: 0.9rem;">Pokušaj sa drugim filterom ili pretragom.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(post => {
        let tagClass = 'tag-nekretnine';
        let tagIcon = '🏢';
        let tagLabel = 'Nekretnine HR';
        
        if (post.category === 'osiguranje') {
          tagClass = 'tag-osiguranje';
          tagIcon = '🛡️';
          tagLabel = 'Osiguranje DE';
        } else if (post.category === 'ai') {
          tagClass = 'tag-ai';
          tagIcon = '🤖';
          tagLabel = 'AI & Biznis';
        }

        const charCount = post.content.length;

        return `
          <div class="card" data-id="${post.id}">
            <div class="card-header">
              <span class="category-tag ${tagClass}">${tagIcon} ${tagLabel}</span>
              ${post.source_url ? `<a href="${post.source_url}" target="_blank" rel="noopener" class="source-link" title="Izvor vijesti">
                Izvor
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
              </a>` : ''}
            </div>

            <h3 class="card-title">${post.title}</h3>

            <div class="post-box">${escapeHtml(post.content)}</div>

            <div class="card-footer">
              <span class="char-badge">${charCount} znakova</span>
              <button class="copy-btn" onclick="copyPost('${post.id}', this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                <span>Kopiraj za LinkedIn</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function copyPost(postId, btn) {
      const post = allPosts.find(p => p.id === postId);
      if (!post) return;

      navigator.clipboard.writeText(post.content).then(() => {
        const originalHtml = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
          <span>Kopirano!</span>
        `;

        showToast("Post je kopiran! Spreman za LinkedIn paste.");

        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = originalHtml;
        }, 2200);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2600);
    }

    // Event Listeners
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderPosts();
      });
    });

    document.getElementById('search-input').addEventListener('input', renderPosts);

    loadData();
  </script>
</body>
</html>
